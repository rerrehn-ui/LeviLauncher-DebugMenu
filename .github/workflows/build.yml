name: Build Levi Debug Menu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.2.13676358 cmake;3.22.1 platform-tools'

      - name: Configure native build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile native mod
        run: cmake --build build --parallel 2

      - name: Package LeviLauncher mod
        run: |
          mkdir -p dist/levi_debug_menu
          cp build/liblevi_debug_menu.so dist/levi_debug_menu/
          cp manifest.json dist/levi_debug_menu/
          cd dist
          cmake -E tar cf levi_debug_menu.levipack \
            --format=zip levi_debug_menu

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: levi-debug-menu
          path: dist/levi_debug_menu.levipack
